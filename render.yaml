# Blueprint do Render: descreve o serviço como código.
# Uso: no painel do Render, New > Blueprint e escolha este repositório,
# ou clique no botão "Deploy to Render" do README.
services:
  - type: web
    name: agendamed
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true          # o Render gera uma chave aleatória e segura
      - key: SEED_DEMO_DATA
        value: "false"               # sem clínica de exemplo nem botão de demonstração
      # Contas de acesso da equipe (e-mail e senha preenchidos no painel do Render).
      # Para trocar um e-mail ou senha: Environment > edite o valor > Save (reinicia sozinho).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DOCTOR_EMAIL
        sync: false
      - key: DOCTOR_PASSWORD
        sync: false
      - key: DOCTOR_NAME
        sync: false
      - key: SECRETARY_EMAIL
        sync: false
      - key: SECRETARY_PASSWORD
        sync: false
      - key: SECRETARY_NAME
        sync: false
      - key: ALLOW_SIGNUP
        value: "false"               # todos os usuários veem os mesmos dados: sem cadastro aberto
      - key: CLINIC_TIMEZONE
        value: America/Sao_Paulo
      - key: TRUST_PROXY
        value: "true"                # o Render fica na frente como proxy reverso
      - key: PASSWORD_HASH_ITERATIONS
        value: "100000"              # menor custo para a CPU limitada do plano gratuito
      - key: WEB_CONCURRENCY
        value: "2"
